name: CI

# Quality gate: every push and PR must pass the curriculum check (all lesson
# solutions green, no pre-solved lessons) and a production build. No broken
# lesson or type error ever reaches the deployed branch.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Curriculum check (all solutions must pass their tests)
        run: npm run check

      - name: Build
        run: npm run build
        env:
          CI: "true"
