name: CI

# Quality gate: every push and PR must pass type-checking, the curriculum +
# engine + logic checks, and a production build. No type error, broken lesson,
# or regressed business logic ever reaches the deployed branch.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Curriculum check (all solutions must pass their tests)
        run: npm run check

      - name: Visualizer engine check
        run: npm run check:viz

      - name: Quality analyzer check
        run: npm run check:quality

      - name: Business logic check
        run: npm run check:logic

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          CI: "true"
